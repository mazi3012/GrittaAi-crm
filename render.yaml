# Gretta AI — Render Blueprint (Telegram Bot)
# Docs: https://render.com/docs/blueprint-spec
#
# Deploys the Telegram long-polling bot as a Docker web service.
# bot.py starts a lightweight HTTP health server on 0.0.0.0:$PORT,
# which satisfies Render's port-binding + health check requirements.
services:
  - type: web
    name: gretta-telegram-bot
    runtime: docker
    branch: main
    plan: free # NOTE: free tier sleeps after ~15 min without inbound HTTP (see README)
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      # ---- PROVIDER CREDENTIALS (values entered in Render Dashboard, never committed) ----
      - key: TELEGRAM_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

      # ---- OPTIONAL ----
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DASHBOARD_URL
        sync: false # public URL of the Vercel dashboard, e.g. https://your-app.vercel.app

      # ---- SHARED DATABASE (recommended) ----
      # Neon Postgres connection string so the Render bot and the Vercel
      # dashboard see the same leads. Without it each service falls back
      # to its own throwaway SQLite file.
      - key: DATABASE_URL
        sync: false
      - key: MODEL
        value: stealth/ox-alpha
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      # Screenshot analysis uses the same ox-alpha model (vision-capable).
      - key: VISION_MODEL
        value: stealth/ox-alpha
      # Render injects PORT automatically; bot.py reads it (default 7860).
      # Do NOT pin DB_PATH: Render's filesystem is ephemeral on restarts.
