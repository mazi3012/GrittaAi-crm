<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gritta CRM — Command Center</title>
  <link rel="icon" type="image/svg+xml" href="/static/gritta-logo-light.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/static/styles.css"/>
</head>
<body>
<div id="aurora"></div>

<div class="shell">

  <!-- ══════════ SIDEBAR ══════════ -->
  <aside id="sidebar">
    <a href="/" class="brand-link">
      <img class="brand-logo" src="/static/gritta-logo-light.svg" data-light-logo="/static/gritta-logo-light.svg" data-dark-logo="/static/gritta-logo-dark.svg" alt="Gritta CRM logo"/>
      <span class="brand-text">
        <span class="brand-title">Gritta CRM</span>
        <span class="brand-subtitle">COMMAND CENTER</span>
      </span>
    </a>

    <nav class="nav-group">
      <button class="nav-btn active" data-view="overview"><span class="ico">📊</span> Overview</button>
      <button class="nav-btn" data-view="team"><span class="ico">👥</span> Team</button>
      <button class="nav-btn" data-view="board"><span class="ico">🗂</span> Pipeline Board</button>
      <button class="nav-btn" data-view="leads"><span class="ico">📋</span> All Leads</button>
      <button class="nav-btn" data-view="access"><span class="ico">🛡</span> Bot Access</button>
    </nav>

    <div class="sidebar-footer">
      <button id="logoutBtn" class="icon-btn" style="display:none;width:100%;" title="End the admin session">⏻ Sign out</button>
      <div class="health-card glass">
        <div class="health-label">Pipeline Health</div>
        <div class="bar-mini"><div id="healthBar" style="width:0%"></div></div>
        <div class="health-stat"><b id="healthPct">0%</b> of leads past “New”</div>
      </div>
      <div class="sidebar-status-row">
        <span class="shortcut-hint">Press <kbd class="key">⌘/Ctrl</kbd>+<kbd class="key">K</kbd></span>
        <span id="botStatus" class="status-indicator">● Bot live</span>
      </div>
    </div>
  </aside>

  <!-- ══════════ MAIN COLUMN ══════════ -->
  <div class="main-column">

    <!-- TOPBAR -->
    <header class="topbar glass">
      <button id="hamburger" class="icon-btn hamburger-btn">☰</button>
      <div class="search-wrap">
        <span class="s-ico">🔎</span>
        <input id="q" class="top-search" placeholder="Search leads by name, owner, summary…" autocomplete="off"/>
      </div>
      <div id="liveWrap" class="live-pill">
        <span class="live-dot" id="liveDot"></span>
        <span id="liveLbl" class="live-label">Live</span>
      </div>
      <div class="topbar-actions">
        <button id="csvBtn" class="icon-btn" title="Export filtered leads as CSV">⤓ CSV</button>
        <button id="themeBtn" class="icon-btn theme-toggle-btn" title="Switch mode">☀️ Light</button>
      </div>
    </header>

    <!-- VIEWS (visibility driven by .view / .view.active in styles.css) -->
    <main class="view-container">
      <section id="view-overview" class="view active"></section>
      <section id="view-team" class="view"></section>
      <section id="view-board" class="view"></section>
      <section id="view-leads" class="view"></section>
      <section id="view-access" class="view"></section>
    </main>
  </div>
</div>

<!-- ══════════ OVERLAYS ══════════ -->
<div id="backdrop"></div>
<aside id="drawer" aria-label="Lead details"><div id="drawerBody"></div></aside>

<div id="cmdk">
  <div class="cmdk-box">
    <input id="cmdkInput" class="cmdk-input" placeholder="Jump to a lead or view…" autocomplete="off"/>
    <div id="cmdkList" class="cmdk-list"></div>
  </div>
</div>

<!-- ══════════ ADMIN LOGIN GATE ══════════ -->
<div id="loginGate">
  <form id="loginForm" class="glass login-box">
    <img class="login-logo" src="/static/gritta-logo-light.svg" data-light-logo="/static/gritta-logo-light.svg" data-dark-logo="/static/gritta-logo-dark.svg" alt="Gritta CRM logo"/>
    <h2>Gritta CRM</h2>
    <p>Admin sign-in required for this dashboard.</p>
    <input id="loginUser" type="text" placeholder="Username" value="admin" autocomplete="username"/>
    <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" required/>
    <div id="loginErr" class="login-err"></div>
    <button id="loginSubmitBtn" type="submit" class="icon-btn primary" style="width:100%;height:40px;">🔐 Sign in</button>
  </form>
</div>

<div id="toasts"></div>

<script src="/static/app.js"></script>
</body>
</html>
